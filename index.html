<script>
'use strict';

/* ============ Config (was editable "props" in the design tool) ============ */
var TRUCK_NAME_KEY = 'driverTruckName_v1';
var PROPS = {
  appName: window.localStorage.getItem(TRUCK_NAME_KEY) || 'My Truck',
};

function editTruckName() {
  var next = window.prompt('Truck / driver name (shown on this device only):', PROPS.appName === 'My Truck' ? '' : PROPS.appName);
  if (next === null) return;
  next = next.trim();
  if (!next) return;
  PROPS.appName = next;
  try { window.localStorage.setItem(TRUCK_NAME_KEY, next); } catch (e) {}
  render();
}

var FIELDS = [
  { key: 'date', label: 'Date', icon: 'calendar_month', type: 'date', section: 'Order Details' },
  { key: 'orderNumber', label: 'Order Number', icon: 'tag', type: 'text', placeholder: 'e.g. ORD-10234', section: 'Order Details' },
  { key: 'customerName', label: 'Customer Name', icon: 'person', type: 'text', placeholder: 'e.g. Meridian Foods', section: 'Order Details' },
  { key: 'bookingNumber', label: 'Booking Number', icon: 'confirmation_number', type: 'text', placeholder: 'e.g. BKG-88213', section: 'Order Details' },
  { key: 'chassisNumber', label: 'Chassis Number', icon: 'directions_bus_filled', type: 'text', placeholder: 'e.g. CH-4471', section: 'Chassis' },
  { key: 'chassisPickupLocation', label: 'Chassis Pickup Location', icon: 'location_on', type: 'text', placeholder: 'e.g. Yard 4, Long Beach', section: 'Chassis' },
  { key: 'chassisDropLocation', label: 'Chassis Drop Location', icon: 'flag', type: 'text', placeholder: 'e.g. Terminal B, LAX', section: 'Chassis' },
  { key: 'containerNumber', label: 'Container Number', icon: 'inventory_2', type: 'text', placeholder: 'e.g. MSCU1234567', section: 'Container' },
  { key: 'pickupLocation', label: 'Container Pickup Location', icon: 'pin_drop', type: 'text', placeholder: 'e.g. Pier 300, LB Port', section: 'Container' },
  { key: 'containerDropLocation', label: 'Container Drop Location', icon: 'outlined_flag', type: 'text', placeholder: 'e.g. Warehouse 12, ONT', section: 'Container' },
  { key: 'notes', label: 'Notes', icon: 'edit_note', type: 'text', placeholder: 'Any special instructions…', section: 'Notes' },
];
var ACCENT = 'oklch(0.4 0.08 155)';
var ACCENT2 = 'oklch(0.35 0.05 55)';
var MUTED = 'oklch(0.62 0.01 95)';
var STORAGE_KEY = 'driverOrderEntries_v1';

/* Section color-coding — modern, roughly complementary hues around the wheel */
var SECTION_COLORS = {
  'Order Details': { base: 'oklch(0.42 0.09 155)', tint: 'oklch(0.94 0.03 155)' },  // green
  'Chassis':        { base: 'oklch(0.48 0.13 258)', tint: 'oklch(0.94 0.025 258)' }, // indigo
  'Container':      { base: 'oklch(0.6 0.15 55)',   tint: 'oklch(0.94 0.045 55)' },  // amber (complements indigo)
  'Notes':          { base: 'oklch(0.5 0.12 330)',  tint: 'oklch(0.94 0.03 330)' },  // plum
};
var DEFAULT_SECTION_COLOR = { base: ACCENT, tint: 'oklch(0.93 0.07 95)' };
function sectionColor(section) { return SECTION_COLORS[section] || DEFAULT_SECTION_COLOR; }

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO() { return toISO(new Date()); }
function emptyForm() {
  var o = {};
  FIELDS.forEach(function (f) { o[f.key] = ''; });
  o.date = todayISO();
  return o;
}
function formatDateLabel(iso) {
  if (!iso) return '—';
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
/* Default report range: most recent Friday through the following Thursday */
function defaultRange() {
  var today = new Date();
  var diffToFriday = (today.getDay() - 5 + 7) % 7; // Friday = 5
  var start = new Date(today);
  start.setDate(today.getDate() - diffToFriday);
  start.setHours(0, 0, 0, 0);
  var end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { start: toISO(start), end: toISO(end) };
}

var MAX_RANGE_DAYS = 92; // defensive cap so a mistyped year can't hang the page

function buildDateRange(startISO, endISO) {
  var s = startISO && !isNaN(new Date(startISO + 'T00:00:00').getTime()) ? startISO : todayISO();
  var e = endISO && !isNaN(new Date(endISO + 'T00:00:00').getTime()) ? endISO : todayISO();
  if (s > e) { var tmp = s; s = e; e = tmp; }
  var startDate = new Date(s + 'T00:00:00');
  var endDate = new Date(e + 'T00:00:00');
  var dayCount = Math.round((endDate - startDate) / 86400000) + 1;
  if (dayCount > MAX_RANGE_DAYS) dayCount = MAX_RANGE_DAYS;

  var days = [];
  for (var i = 0; i < dayCount; i++) {
    var d = new Date(startDate);
    d.setDate(startDate.getDate() + i);
    var iso = toISO(d);
    days.push({
      iso: iso,
      dayName: d.toLocaleDateString(undefined, { weekday: 'long' }),
      dateLabel: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
      isToday: iso === todayISO(),
    });
  }
  var first = days[0], last = days[days.length - 1];
  return {
    startISO: first.iso,
    endISO: last.iso,
    days: days,
    label: first.dateLabel + ' – ' + last.dateLabel + ', ' + endDate.getFullYear(),
  };
}

/* Chunk a flat day-group list into 7-day weeks for the collapsible report UI */
function chunkIntoWeeks(dayGroups) {
  var weeks = [];
  for (var i = 0; i < dayGroups.length; i += 7) {
    var chunk = dayGroups.slice(i, i + 7);
    var first = chunk[0], last = chunk[chunk.length - 1];
    var year = new Date(last.iso + 'T00:00:00').getFullYear();
    var total = chunk.reduce(function (sum, d) { return sum + d.count; }, 0);
    weeks.push({
      key: first.iso,
      label: first.dateLabel + ' – ' + last.dateLabel + ', ' + year,
      total: total,
      days: chunk,
    });
  }
  return weeks;
}
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ============ App state (mirrors the original component's `state`) ============ */
var state = {
  tab: 'entry',
  form: emptyForm(),
  entries: [],
  editingId: null,
  rangeStart: defaultRange().start,
  rangeEnd: defaultRange().end,
  expandedWeekKeys: {}, // week chunk key -> true/false override; unset = default (last chunk open, earlier ones collapsed)
};

(function loadEntries() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) state.entries = JSON.parse(raw);
  } catch (e) {}
})();

function persist(entries) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
}

function updateField(key, value) {
  state.form[key] = value;
}

function resetForm() {
  state.form = emptyForm();
  state.editingId = null;
  render();
}

function saveEntry() {
  var f = state.form;
  if (!f.orderNumber) {
    window.alert('Please fill in the order number.');
    return;
  }
  var entries;
  if (state.editingId) {
    entries = state.entries.map(function (e) {
      return e.id === state.editingId ? Object.assign({}, f, { id: e.id }) : e;
    });
  } else {
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    entries = [Object.assign({}, f, { id: id })].concat(state.entries);
  }
  persist(entries);
  state.entries = entries;
  state.form = emptyForm();
  state.editingId = null;
  render();
}

function editEntry(id) {
  var e = state.entries.find(function (x) { return x.id === id; });
  if (!e) return;
  state.form = Object.assign({}, e);
  state.editingId = id;
  state.tab = 'entry';
  render();
}

var SHARE_KEYS = ['orderNumber', 'containerNumber', 'chassisNumber'];

function entryToText(e) {
  var lines = [];
  SHARE_KEYS.forEach(function (key) {
    var f = FIELDS.find(function (x) { return x.key === key; });
    lines.push(f.label + ': ' + (e[key] || '—'));
  });
  return lines.join('\n');
}

function shareEntry(id) {
  var e = state.entries.find(function (x) { return x.id === id; });
  if (!e) return;
  var subject = 'Order ' + (e.orderNumber || '');
  var body = entryToText(e);

  if (navigator.share) {
    navigator.share({ title: subject, text: body }).catch(function () { /* user cancelled */ });
  } else {
    window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }
}

function deleteEntry(id) {
  if (!window.confirm('Delete this entry?')) return;
  var entries = state.entries.filter(function (e) { return e.id !== id; });
  persist(entries);
  state.entries = entries;
  if (state.editingId === id) { state.editingId = null; state.form = emptyForm(); }
  render();
}

function setTab(tab) { state.tab = tab; render(); }
function setRangeField(field, value) {
  if (field === 'start') state.rangeStart = value;
  else state.rangeEnd = value;
  render();
}
function toggleWeek(key, currentlyExpanded) {
  state.expandedWeekKeys[key] = !currentlyExpanded;
  render();
}
function downloadPdf() {
  // Read the date inputs directly in case a browser hasn't fired
  // 'change' yet (e.g. a picker still open when this is clicked) —
  // guarantees the PDF always matches what's on screen.
  var startInput = document.querySelector('input[data-range-field="start"]');
  var endInput = document.querySelector('input[data-range-field="end"]');
  if (startInput && startInput.value) state.rangeStart = startInput.value;
  if (endInput && endInput.value) state.rangeEnd = endInput.value;

  var v = computeVals();
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'pt', format: 'letter' });
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var margin = 40;
  var y = 50;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(20, 20, 20);
  doc.text(PROPS.appName + ' — Report', margin, y);

  y += 18;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text(v.rangeLabel, margin, y);
  doc.text('Total orders: ' + v.rangeTotal, pageWidth - margin, y, { align: 'right' });

  y += 12;
  doc.setDrawColor(20, 20, 20);
  doc.setLineWidth(1.2);
  doc.line(margin, y, pageWidth - margin, y);
  y += 20;

  v.rangeGroups.forEach(function (grp) {
    if (y > pageHeight - 90) { doc.addPage(); y = 50; }

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(20, 20, 20);
    doc.text(grp.dayName + '   ' + grp.dateLabel + '  ·  ' + grp.count + ' orders', margin, y);
    y += 10;

    if (grp.entries.length) {
      doc.autoTable({
        startY: y,
        margin: { left: margin, right: margin },
        head: [['Order #', 'Customer', 'Booking #', 'Chassis #', 'Chassis Pickup', 'Chassis Drop', 'Container #', 'Container Pickup', 'Container Drop']],
        body: grp.entries.map(function (e) {
          return [e.orderNumber, e.customerName, e.bookingNumber, e.chassisNumber, e.chassisPickupLocation, e.chassisDropLocation, e.containerNumber, e.pickupLocation, e.containerDropLocation];
        }),
        styles: { fontSize: 8, cellPadding: 4, lineColor: [220, 220, 220], lineWidth: 0.5 },
        headStyles: { fillColor: [235, 235, 228], textColor: [30, 30, 30], fontStyle: 'bold' },
        theme: 'grid',
      });
      y = doc.lastAutoTable.finalY + 20;
    } else {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(140, 140, 140);
      doc.text('No orders logged.', margin, y + 10);
      y += 26;
    }
  });

  var safeName = (PROPS.appName || 'Report').replace(/[^\w-]+/g, '-');
  var safeRange = v.rangeLabel.replace(/[^\w-]+/g, '-');
  doc.save(safeName + '_' + safeRange + '.pdf');
}

/* ============ Derived view-model (mirrors the original `renderVals`) ============ */
function computeVals() {
  var s = state;
  var fields = FIELDS.map(function (f) {
    return Object.assign({}, f, { value: s.form[f.key] || '' });
  });
  var lastSection = null;
  fields.forEach(function (f) { f.sectionStart = f.section !== lastSection; lastSection = f.section; });

  var sortedEntries = s.entries.slice().sort(function (a, b) {
    return (b.date || '').localeCompare(a.date || '') || (b.id || '').localeCompare(a.id || '');
  });
  var detailKeys = FIELDS.filter(function (f) { return f.key !== 'date' && f.key !== 'orderNumber' && f.key !== 'customerName'; });
  var entryCards = sortedEntries.map(function (e) {
    return {
      id: e.id,
      orderNumber: e.orderNumber || '—',
      customerName: e.customerName || '—',
      dateLabel: formatDateLabel(e.date),
      details: detailKeys.map(function (f) { return { icon: f.icon, label: f.label, value: e[f.key] || '—', section: f.section }; }),
    };
  });

  var range = buildDateRange(s.rangeStart, s.rangeEnd);
  var rangeEntries = s.entries.filter(function (e) { return e.date && e.date >= range.startISO && e.date <= range.endISO; });
  var rangeGroups = range.days.map(function (d) {
    var dayEntries = rangeEntries.filter(function (e) { return e.date === d.iso; })
      .sort(function (a, b) { return (a.orderNumber || '').localeCompare(b.orderNumber || ''); });
    return {
      iso: d.iso, dayName: d.dayName, dateLabel: d.dateLabel, isToday: d.isToday,
      count: dayEntries.length,
      entries: dayEntries.map(function (e) {
        return {
          id: e.id,
          orderNumber: e.orderNumber || '—',
          customerName: e.customerName || '—',
          bookingNumber: e.bookingNumber || '—',
          chassisNumber: e.chassisNumber || '—',
          chassisPickupLocation: e.chassisPickupLocation || '—',
          chassisDropLocation: e.chassisDropLocation || '—',
          containerNumber: e.containerNumber || '—',
          pickupLocation: e.pickupLocation || '—',
          containerDropLocation: e.containerDropLocation || '—',
        };
      }),
    };
  });

  var weekChunks = chunkIntoWeeks(rangeGroups);
  weekChunks.forEach(function (chunk, i) {
    var isLast = i === weekChunks.length - 1;
    var defaultExpanded = weekChunks.length <= 1 || isLast;
    chunk.expanded = s.expandedWeekKeys.hasOwnProperty(chunk.key) ? s.expandedWeekKeys[chunk.key] : defaultExpanded;
  });

  return {
    isEntryTab: s.tab === 'entry',
    isReportTab: s.tab === 'report',
    fields: fields,
    isEditing: !!s.editingId,
    entryCards: entryCards,
    entryCount: entryCards.length,
    rangeStartInput: s.rangeStart,
    rangeEndInput: s.rangeEnd,
    rangeLabel: range.label,
    rangeGroups: rangeGroups,
    rangeTotal: rangeEntries.length,
    weekChunks: weekChunks,
  };
}

/* ============ Rendering ============ */
function render() {
  var v = computeVals();

  document.getElementById('appNameLabel').textContent = PROPS.appName;
  document.getElementById('entryCountBadge').textContent = v.entryCount + ' saved';
  document.getElementById('printAppName').textContent = PROPS.appName + ' — Report';

  document.getElementById('tabEntryBtn').style.color = v.isEntryTab ? ACCENT : MUTED;
  document.getElementById('tabReportBtn').style.color = v.isReportTab ? ACCENT2 : MUTED;
  document.querySelector('#tabEntryBtn .material-symbols-outlined').style.fontVariationSettings = "'FILL' " + (v.isEntryTab ? 1 : 0) + ",'wght' 500";
  document.querySelector('#tabReportBtn .material-symbols-outlined').style.fontVariationSettings = "'FILL' " + (v.isReportTab ? 1 : 0) + ",'wght' 500";

  document.getElementById('entryTab').style.display = v.isEntryTab ? '' : 'none';
  document.getElementById('reportTab').style.display = v.isReportTab ? '' : 'none';

  if (v.isEntryTab) renderEntryTab(v);
  if (v.isReportTab) renderReportTab(v);
  renderPrintReport(v);
}
